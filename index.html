

<!DOCTYPE html>

<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Controlled Chaos v0.2</title>

  <link rel="stylesheet" href="styles.css">

  <script src="app.js" defer></script>

</head>

<body>

  <main class="container">

    <header>

      <h1>CONTROLLED CHAOS</h1>

      <p>Think differently. Defend your connections.</p>

    </header>

    <section id="menu">

      <h2>Choose Your Chaos</h2>

      <button id="rushBtn">⚡ Chaos Rush</button>

      <button id="chainBtn">🔗 Chaos Chain</button>

      <p>Two players • Local competition</p>

    </section>

    <section id="game" hidden>

      <h2 id="modeTitle"></h2>

      <p id="roundInfo"></p>

      <p id="prompt"></p>

      <div class="meter">

        <div id="chaosFill"></div>

      </div>

      <p id="chaosText">Chaos: 10%</p>

      <p id="turnInfo"></p>

      <form id="answerForm">

        <input

          id="answer"

          placeholder="Enter your answer"

          autocomplete="off"

          required

        >

        <button type="submit">Submit</button>

      </form>

      <div id="reveal"></div>

      <div id="chainHistory"></div>

      <h3>Leaderboard</h3>

      <div id="leaderboard"></div>

      <button id="nextBtn" hidden>Next Round</button>

      <button id="menuBtn">Back to Menu</button>

    </section>

  </main>

</body>

</html>
